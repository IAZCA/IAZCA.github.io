function flight(){
  var who=mark.firstChild,m=who.getBoundingClientRect(),h=$('name');
  title.style.setProperty('--nx',Math.round(m.left+m.width/2-room.clientWidth/2)+'px');
  title.style.setProperty('--ny',Math.round(m.top+m.height/2-title.offsetTop-h.offsetTop-h.offsetHeight/2)+'px');
  title.style.setProperty('--nk',(parseFloat(getComputedStyle(who).fontSize)/parseFloat(getComputedStyle(h).fontSize)).toFixed(3));
}
function tab(){return titled?aboutLink:links[want]}
function moveBar(){var a=tab();bar.style.transform='translateX('+(a.offsetLeft+a.offsetWidth/2-11)+'px)'}
function nav(){
  var on=tab();[aboutLink].concat(links).forEach(function(a){if(a===on)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  moveBar();history.replaceState(null,'','#'+(titled?'about':ROOMS[want].id));
}

/* State */
var cur=0,want=0,pos=0,vel=0,target=0,frontK=null,titled=true,dolly=0,dollyT=0,lit=0,litT=TITLE_LIT;
var raf=0,last=0,moving=false,g=null,swallow=false,capTimer=0,swapTimer=0;
var OMEGA=8.5;

function sync(){
  var c=Math.round(pos),r=ROOMS[cur];
  slots.forEach(function(s,i){
    var k=c+mod(i-c+HALF,POOL)-HALF;if(s.k===k)return;
    s.k=k;s.el.style.transform='rotateY('+(-k*STEP)+'deg) translateZ('+(-R)+'px)';
    var x=r.items[mod(k,r.items.length)];
    if(s.x!==x){s.x=x;setPic(s.img,x);setPic(s.mimg,x);s.pill.textContent=r.act;s.el.classList.toggle('album',!!x.photos)}
  });
}
function render(){
  sync();
  ring.style.transform='translateZ('+(R-dolly).toFixed(2)+'px) rotateY('+(pos*STEP).toFixed(3)+'deg)';
  var reach=Math.min(HALF,(ROOMS[cur].items.length-1)>>1); /* a short room shows each project once, never the same screen twice */
  slots.forEach(function(s){
    var d=Math.abs(s.k-pos),u=Math.min(d,1),o=1-(1-SIDE)*u*u*(3-2*u);
    if(d>1)o=SIDE*(1-clamp((d-1)/(reach-.5),0,1)*(reach>1?.7:1));
    if(d>reach+.2)o=0;
    o=Math.round(o*lit*1000)/1000;
    if(o!==s.o){s.o=o;s.el.style.opacity=o;s.el.style.visibility=o?'':'hidden'}
  });
  spill.style.opacity=(.3*lit).toFixed(3);
}
function setMoving(v){if(v!==moving){moving=v;room.classList.toggle('moving',v)}}
function frame(now){
  raf=0;var dt=Math.min(.4,(now-last)/1000||.016);last=now; /* exact for any step, so a slow phone keeps real time */
  var busy=false,held=g&&g.axis==='x';
  if(!held){
    if(calm){pos=target;vel=0}
    var x=pos-target,e=Math.exp(-OMEGA*dt),q=(vel+OMEGA*x)*dt;
    pos=target+(x+q)*e;vel=(vel-OMEGA*q)*e;
    if(Math.abs(pos-target)<.0008&&Math.abs(vel)<.004){pos=target;vel=0}else busy=true;
  }
  if(calm){dolly=dollyT;lit=litT}
  dolly+=(dollyT-dolly)*(1-Math.exp(-dt*2.7));
  lit+=(litT-lit)*(1-Math.exp(-dt*4.4));
  if(Math.abs(dolly-dollyT)<.4)dolly=dollyT;else busy=true;
  if(Math.abs(lit-litT)<.004)lit=litT;else busy=true;
  render();setFront();
  setMoving(!!held||Math.abs(pos-target)>.03);
  if(busy)raf=requestAnimationFrame(frame);
  if(!held&&!wheelOn&&pos===target)rest();
}
function kick(){if(!raf){last=performance.now();raf=requestAnimationFrame(frame)}}

/* Front screen */
function frontSlot(){if(frontK===null)return null;for(var i=0;i<POOL;i++)if(slots[i].k===frontK)return slots[i];return null}
function setFront(force){
  var r=ROOMS[cur];
  var c=Math.round(pos);if(c===frontK&&!force)return;
  frontK=c;liveOff();
  var n=r.items.length,a=document.activeElement,had=!!(a&&a.closest&&a.closest('.pool .face'));
  slots.forEach(function(s){
    var on=s.k===c;s.el.classList.toggle('front',on);s.el.classList.toggle('clip',on&&!!s.x.clip&&!s.x.photos&&!IZ.still);
    if(on){s.face.dataset.open=r.group+':'+mod(c,n);s.face.setAttribute('aria-label',r.act+': '+s.x.t);s.face.removeAttribute('tabindex');s.face.removeAttribute('aria-hidden');if(had)s.face.focus({preventScroll:true})}
    else{delete s.face.dataset.open;s.face.removeAttribute('aria-label');s.face.tabIndex=-1;s.face.setAttribute('aria-hidden','true')}
  });
  prev.setAttribute('aria-label','Previous screen: '+r.items[mod(c-1,n)].t);
  next.setAttribute('aria-label','Next screen: '+r.items[mod(c+1,n)].t);
  clearTimeout(capTimer);cap.classList.add('swap');
  capTimer=setTimeout(function(){fill(cap,r,r.items[mod(c,n)],mod(c,n));cap.classList.remove('swap')},calm?0:190);
}

/* The one thing on screen that plays: a shared clip, or a slow album slideshow, on the front screen only */
var live=document.createElement('div'),vid=null,pics=[new Image(),new Image()],liveX=null,showTimer=0,turn=0;
var sheen=document.createElement('div'),glass=document.createElement('canvas'),ink=glass.getContext('2d'),gleam=[new Image(),new Image()],paintTimer=0;
live.className='live';pics.forEach(function(p){p.alt='';live.appendChild(p)});
sheen.className='sheen';sheen.appendChild(glass);gleam.forEach(function(p){p.alt='';sheen.appendChild(p)});
function liveOff(){
  liveX=null;clearInterval(showTimer);clearInterval(paintTimer);live.classList.remove('on');sheen.classList.remove('on');
  pics.concat(gleam).forEach(function(p){p.classList.remove('on')});
  if(vid)vid.pause();
}
function mount(s,mode){
  live.dataset.mode=sheen.dataset.mode=mode;
  if(live.parentNode!==s.face)s.face.insertBefore(live,s.face.children[1]);
  if(sheen.parentNode!==s.mirror)s.mirror.appendChild(sheen);
}
function paint(){if(vid.readyState>1)ink.drawImage(vid,0,0,glass.width,glass.height)}
function floorOn(){
  clearInterval(paintTimer);if(noFloor||!ink)return;
  glass.width=160;glass.height=Math.round(160*(vid.videoHeight/vid.videoWidth||.5625));ink.imageSmoothingQuality='high'; /* resizing a canvas resets this; without it the big downscale leaves jagged edges */
  paint();paintTimer=setInterval(paint,lite?125:66);sheen.classList.add('on');
}
function makeVideo(){
  vid=document.createElement('video');vid.muted=true;vid.defaultMuted=true;vid.loop=true;vid.playsInline=true;vid.preload='auto';
  ['muted','playsinline','data-manual'].forEach(function(a){vid.setAttribute(a,'')});
  vid.addEventListener('playing',function(){if(liveX){live.classList.add('on');floorOn()}});
  live.insertBefore(vid,live.firstChild);
}
function playVideo(){var q=vid.play();if(q&&q.catch)q.catch(function(){})} /* refused autoplay leaves the poster showing */
function rest(){
  setMoving(false);
  var s=frontSlot();if(!s||IZ.opened||IZ.still||document.hidden||s.x===liveX)return;
  var x=s.x;
  if(x.photos){
    liveX=x;mount(s,'p');live.classList.add('on');sheen.classList.add('on');
    var list=x.photos.filter(function(p){return p!==x.poster}).concat(x.poster),i=0;
    showTimer=setInterval(function(){
      var src=list[i++%list.length],pre=new Image();
      pre.onload=function(){
        if(liveX!==x)return;
        [pics,gleam].forEach(function(p){p[turn].src=src;p[turn].classList.add('on');p[turn^1].classList.remove('on')});
        turn^=1;
      };
      pre.src=src;
    },3600);
  }else if(x.clip){
    if(!vid)makeVideo();
    liveX=x;mount(s,'v');
    if(vid.getAttribute('src')!==x.clip){vid.poster=x.poster;vid.src=x.clip}
    playVideo();
  }
}
document.addEventListener('visibilitychange',function(){if(document.hidden){liveOff()}else rest()});

/* Moving around */
function enter(){
  if(!titled)return;titled=false;room.classList.remove('titled');dollyT=0;litT=1;nav();kick();
}
function showTitle(){
  if(want!==0)show(0);
  titled=true;room.classList.add('titled');card.scrollTop=0;dollyT=R;litT=TITLE_LIT;nav();kick();
}
function go(k){target=k;kick()}
function step(d){go(Math.round(target)+d)}
function build(i,dir){
  cur=i;var r=ROOMS[i];
  room.dataset.room=r.id;liveOff();frontK=null;placeCentre();
  slots.forEach(function(s){s.k=null;s.x=null;s.o=-1;s.el.classList.remove('front','clip')});
  target=r.at;pos=calm?target:target-.42*dir;vel=0;
  render();setFront(true);kick();
}
function show(i){
  if(i===want)return;
  var dir=i>want?1:-1;want=i;
  nav();
  ROOMS[cur].at=Math.round(target);
  stage.classList.add('out');stage.style.transform='translate3d(0,'+(-dir*22)+'px,0)';
  clearTimeout(swapTimer);
  swapTimer=setTimeout(function(){
    build(i,dir);
    stage.classList.add('held');stage.style.transform='translate3d(0,'+(dir*22)+'px,0)';
    stage.getBoundingClientRect();
    stage.classList.remove('held','out');stage.style.transform='';
  },calm?0:300);
}
function openFront(s){
  if(IZ.opened)return;
  enter();litT=0;kick();if(vid)vid.pause();clearInterval(showTimer);clearInterval(paintTimer);
  /* the viewer starts from the same sharp picture that is on the screen, so the grow has no jump */
  IZ.open(s.x.yt?Object.assign({},s.x,{poster:s.img.currentSrc||s.img.src}):s.x,s.face);
}
addEventListener('popstate',function(){ /* the viewer is closing: lights up, screen back on */
  litT=titled?TITLE_LIT:1;kick();
  setTimeout(function(){var s=frontSlot();if(!s||IZ.opened&&document.querySelector('.iz-scrim.on'))return;clearInterval(showTimer);clearInterval(paintTimer);liveX=null;rest()},680);
});

/* Taps */
stage.addEventListener('click',function(e){
  if(swallow){swallow=false;e.stopPropagation();e.preventDefault();return}
  if(e.target.closest('.mail'))return;
  if(titled){e.stopPropagation();enter();return} /* the words lie over the screen, so the first tap only starts the visit */
  function slotOf(f){return slots.filter(function(n){return n.face===f})[0]}
  var ed=e.target.closest('.edge');
  if(ed){ /* a wide window can show two screens under one edge: turn to the one under the pointer */
    var under=e.detail?document.elementsFromPoint(e.clientX,e.clientY).filter(function(n){return n.matches('.pool .face')})[0]:null;
    var uk=under?slotOf(under).k:null;
    if(uk!==null&&uk!==Math.round(pos))go(uk);else step(+ed.dataset.d);
    return;
  }
  var f=e.target.closest('.pool .face');
  if(f){
    e.stopPropagation();
    var s=slotOf(f);
    if(s.k===Math.round(pos))openFront(s);else go(s.k);
  }
});
mark.addEventListener('click',showTitle);
$('go').addEventListener('click',enter);

/* Fingers and mouse: the axis locks after 8px, sideways turns the ring, up and down walks between rooms */
function grab(e){
  if(IZ.opened||e.button>0)return;
  if(g){g=null;stage.classList.remove('held');stage.style.transform=stage.style.opacity='';target=Math.round(pos);kick();return} /* second finger: a pinch belongs to the browser */
  if(e.pointerType==='mouse'&&e.target.closest('.txt'))return;
  swallow=false;
  g={id:e.pointerId,x:e.clientX,y:e.clientY,p0:pos,axis:'',lx:e.clientX,lt:e.timeStamp,v:0,was:titled,inCard:!!e.target.closest('.card')};
}
stage.addEventListener('pointerdown',grab);card.addEventListener('pointerdown',grab);
addEventListener('pointermove',function(e){
  if(!g||e.pointerId!==g.id)return;
  var dx=e.clientX-g.x,dy=e.clientY-g.y;
  if(!g.axis){
    if(Math.abs(dx)<8&&Math.abs(dy)<8)return;
    g.axis=Math.abs(dx)>=Math.abs(dy)?'x':'y';
    if(g.axis==='y'&&g.inCard&&card.classList.contains('scrolls')){g=null;return} /* a long About on a small phone scrolls by itself */
    swallow=true;enter();
    g.p0=pos;g.x=e.clientX;g.y=e.clientY;g.lx=e.clientX;g.lt=e.timeStamp;dx=dy=0;
    try{stage.setPointerCapture(g.id)}catch(_){}
    stage.classList.add('held');
  }
  if(g.axis==='x'){
    pos=g.p0-dx/PX;
    var t=e.timeStamp-g.lt;
    if(t>0){g.v=g.v*.7+(-(e.clientX-g.lx)/PX/(t/1000))*.3;g.lx=e.clientX;g.lt=e.timeStamp}
    kick();
  }else{
    stage.style.transform='translate3d(0,'+(dy*.2).toFixed(1)+'px,0)';
    stage.style.opacity=(1-Math.min(Math.abs(dy)/420,.5)).toFixed(3);
  }
});
function release(e){
  if(!g||e.pointerId!==g.id)return;
  var a=g;g=null;stage.classList.remove('held');
  setTimeout(function(){swallow=false},60);
  if(a.axis==='x'){
    var v=e.timeStamp-a.lt>90?0:a.v;
    var base=Math.round(a.p0),t=Math.round(pos+v*.2);
    if(t===base&&Math.abs(v)>.7)t=base+(v>0?1:-1);
    target=clamp(t,base-4,base+4);vel=clamp(v,-7,7);
    kick();
  }else if(a.axis==='y'){
    stage.style.transform=stage.style.opacity='';
    if(e.type==='pointercancel'||a.was)return;
    var dy=e.clientY-a.y,quick=Math.abs(dy)>26&&e.timeStamp-a.lt<260;
    if(Math.abs(dy)<64&&!quick)return;
    if(dy<0){if(want<ROOMS.length-1)show(want+1)}
    else if(want>0)show(want-1);else showTitle();
  }
}
addEventListener('pointerup',release);addEventListener('pointercancel',release);

/* Wheel and trackpad: the ring chases the gesture, then settles on the nearest screen, at least one screen per notch */
var wheelOn=false,wheelF=0,wheelStart=0,wheelTimer=0,wheelMute=0;
room.addEventListener('wheel',function(e){
  if(IZ.opened||e.target.closest('.scrolls'))return;
  e.preventDefault();
  if(titled){enter();wheelMute=e.timeStamp+260;return} /* the first scroll only starts the visit; its trackpad tail must not spin the ring */
  if(e.timeStamp<wheelMute){wheelMute=e.timeStamp+160;return}
  if(e.target.closest('.tabs'))return;
  var d=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;if(e.deltaMode===1)d*=33;
  if(!wheelOn){wheelOn=true;wheelStart=Math.round(target);wheelF=target}
  wheelF+=d/280;target=wheelF;kick();
  clearTimeout(wheelTimer);
  wheelTimer=setTimeout(function(){
    wheelOn=false;var t=Math.round(wheelF);if(t===wheelStart&&wheelF!==wheelStart)t+=wheelF>wheelStart?1:-1;
    target=t;kick();
  },110);
},{passive:false});

addEventListener('keydown',function(e){
  if(IZ.opened)return;var k=e.key;
  if(k==='ArrowRight'||k==='ArrowLeft'){e.preventDefault();enter();step(k==='ArrowRight'?1:-1)}
  else if(k==='ArrowDown'||k==='ArrowUp'){
    e.preventDefault();if(titled){if(k==='ArrowDown')enter();return}
    var i=want+(k==='ArrowDown'?1:-1);if(i<0)showTitle();else if(i<ROOMS.length)show(i);
  }else if((k==='Enter'||k===' ')&&(document.activeElement===document.body||!document.activeElement)){
    e.preventDefault();var s=frontSlot();if(titled)enter();else if(s)openFront(s);
  }
});

/* Start */
var start=ROOMS.map(function(r){return r.id}).indexOf(location.hash.slice(1));
if(start>=0){titled=false;room.classList.remove('titled');litT=1;cur=want=start}
nav();
room.dataset.room=ROOMS[cur].id;
layout();
dolly=dollyT;
build(cur,1);pos=target;render();
/* A timer, not a frame: frames stop while a page is hidden, which left the ring stuck at the size it first loaded in */
var sized=0;function refit(){clearTimeout(sized);sized=setTimeout(function(){if(room.clientWidth!==laidW||room.clientHeight!==laidH)layout()},60)}
addEventListener('resize',refit);addEventListener('pageshow',refit);document.addEventListener('visibilitychange',refit);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(layout);
})();
</script></body></html>
